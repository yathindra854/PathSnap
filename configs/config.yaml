# PathSnap project configuration (fill in during Phase 0)
data:
  raw_dir: data/raw
  processed_dir: data/processed
  partitions:
    train_trips: 80
    student_test_trips: 10
    evaluator_test_trips: 10   # never used for training, tuning or selection

candidates:
  radius_m: 50          # v0; to be confirmed with the R sweep (30/50/75/100)
  crs: per_trip_utm     # trips are in different cities; UTM zone from each trip's mean lon/lat
  label_window: 5       # route look-ahead for label alignment

cv:
  scheme: GroupKFold    # group by trip_id to prevent leakage
  n_splits: 5
  random_seed: 42

hmm:
  transition_model: null   # TODO
  emission_model: null     # TODO

optimisation:
  sampler: TPE
  n_trials: null           # TODO
  objective: cv_macro_f1
